[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-ocr-nar-small"
version = "1.1.0"
description = "Japanese manga text-box OCR, non-autoregressive: manga-ocr-nar-small (54M) and manga-ocr-nar-small-distil (30M)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Code: Apache-2.0; model weights: CC BY-NC-SA 4.0"}
dependencies = ["numpy", "Pillow"]

[project.optional-dependencies]
cuda = ["torch>=2.1", "safetensors"]
cpu = ["onnxruntime>=1.17"]
mac = ["pyobjc-framework-CoreML>=10"]

[project.scripts]
manga-ocr-nar-small = "manga_ocr_nar_small.cli:main"
mangaocr-nar-small = "manga_ocr_nar_small.cli:main"   # old command name, kept after the 2026-10-14 rename

[tool.setuptools]
packages = ["manga_ocr_nar_small", "manga_ocr_nar_small.backends", "mangaocr_nar_small"]
